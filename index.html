<meta charset="UTF-8">
<title>Luxe Home Decor</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url("https://unsplash.com/photos/U9ps5Ek8JPA/download?force=true") center/cover fixed;
color:#fff;
}


/* HEADER */
header{ 
background: linear-gradient( to right, rgba(0,0,0,.75),rgba(30,30,30,.6));
backdrop-filter: (18px);
box-shadow: 0 10px 30px rgba(0,0,0,.6);
padding:15px 40px;
display:flex;justify-content:space-between;align-items:center
}
nav a{
    padding: 8px 18px;
    border-radius: 30px;
    font-size: 14px;
    letter-spacing: .5px;
color:#fff;margin-left:20px;text-decoration:none;
position:relative
};
nav a::after{
content:"";position:absolute; inset:0; background: rgba(0,0,0.25);
transition:.3s
}
nav a:hover::after{ background: rgba(255,210,125,.18);
    color:#ffd27d
    
    
    }

/* HERO */
.hero{

padding:140px 20px; text-shadow: 0 5px 20px rgba(0,0,0,.8);  text-align:center;
animation:fadeIn 1.5s ease
}
.hero h1{
    font-family:'Playfair Display',serif; font-size: 48px;
}
.hero p{
    margin-top: 10px;
    letter-spacing: 3px;
}
@keyframes fadeIn{
from{opacity:0;transform:translateY(30px)}
to{opacity:1;transform:translateY(0)}
}

/* SECTIONS */
section{padding:40px}
h2{margin-bottom:20px}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px
}

.product{
border-radius: 28px;
border-radius:18px;
border:1px solid rgba(255,255,255,.25);
overflow:hidden;text-align:center;
transition:.4s;
box-shadow:0 10px 35px rgba(0,0,0,.4)
}
.product h3{
    font-family: 'Playfair Display',serif;
    font-size: 18px;
}
.product p{
    letter-spacing: .5px;
}
.product:hover{
transform:translateY(-12px) scale(1.03);
box-shadow:0 20px 45px rgba(0,0,0,.6),inset 0 0 25px rgba(255,255,255,.1);
}
.product img{
width:100%;height:220px;object-fit:cover;
transition:.5s
}
.product:hover img{transform:scale(1.1)}
.product p{color:#ffd27d;font-weight:bold}

/* BUTTONS */
button{
background:linear-gradient(135deg,#d4af37,#b68d40);
border:none;color:white;
padding:10px 18px;border-radius:30px;
cursor:pointer;transition:.3s
}
button:hover{
transform:scale(1.05);
box-shadow:0 5px 20px rgba(0,0,0,.6)
}

/* GLASS BOXES */
.cart,.payment,.tracking,.contact{
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
margin:30px;border-radius:20px;
padding:25px;
box-shadow:0 12px 40px rgba(0,0,0,.5);
border:1px solid rgba(255,255,255,.25)
}

input,select{
width:100%;padding:8px;margin-top:8px;
background:rgba(255,255,255,.25);
border:none;color:#fff;border-radius:6px
}
input::placeholder{color:#eee}

/* PAYMENT ICONS */
.payment-icons img{
width:90px;margin:10px;padding:6px;
background:white;border-radius:12px;
transition:.3s;cursor:pointer
}
.payment-icons img:hover{
transform:scale(1.15);
box-shadow:0 5px 15px rgba(0,0,0,.6)
}

/* TRACKING */
.progress div{
padding:10px;margin:6px 0;
border-left:5px solid rgba(255,255,255,.4);
opacity:.7;transition:.4s
}
.progress .active{
opacity:1;
border-color:#ffd27d;
background:rgba(255,255,255,.2)
}

/* MAP */
iframe{
width:100%;height:300px;border:none;
border-radius:15px;margin-top:15px
}

footer{
background:rgba(0,0,0,.6);
backdrop-filter:blur(10px);
text-align:center;padding:15px
}
@media(max-width:768px){
    .hero h1{font-size:30px}
    .intro-box{margin:-40px 15px 309px}
}
@media(max-width:480px){
    .hero h1{font-size: 24px;}
}
</style>

let cart=[],total=0;

function load(arr,id){
const d=document.getElementById(id);
arr.forEach(p=>{
d.innerHTML+=`
<div class="product">
<img src="${p.img}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
<button onclick="add(${p.id})">Add to Cart</button>
</div>`;
});
}
load(decor,"decorProducts");
load(murti,"murtiProducts");

function add(id){
const item=[...decor,...murti].find(p=>p.id===id);
cart.push(item);total+=item.price;
document.getElementById("count").innerText=cart.length;
render();
}

function render(){
const d=document.getElementById("cartItems");
d.innerHTML="";
cart.forEach(i=>d.innerHTML+=`<p>${i.name} - ₹${i.price}</p>`);
document.getElementById("total").innerText=total;
calculateEMI();
}

function calculateEMI(){
const m=document.getElementById("emi").value;
if(m==0){document.getElementById("emiResult").innerText="";return;}
const rate={3:12,6:14,12:16}[m]/100;
const interest=total*rate*(m/12);
const payable=total+interest;
document.getElementById("emiResult").innerText=
`Monthly EMI: ₹${(payable/m).toFixed(0)} | Total Payable: ₹${payable.toFixed(0)}`;
}

function openPayment(){
document.getElementById("payment").style.display="block";
}

function pay(method){
alert("Payment Successful via "+method+" ✅");
}

function track(){
const d=document.getElementById("progress");
d.innerHTML="";
["Order Placed","Payment Confirmed","Packed","Shipped","Out for Delivery","Delivered"]
.forEach((s,i)=>{
setTimeout(()=>{
d.innerHTML+=`<div class="active">${i+1}. ${s}</div>`;
},i*300);
});
}
